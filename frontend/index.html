<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEXUS</title>
  <link rel="icon" type="image/png" href="img/nexus-icone.png">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <!-- Tela de acesso: usuário e senha (ADR-018). Com "manter conectado" a sessão vale 30 dias neste navegador. -->
  <main id="login" class="login" hidden>
    <form id="form-login" class="card login-card">
      <img class="logo-nexus" src="img/nexus-logo.webp" alt="Nexus — Conexão e Inovação" width="660" height="240">
      <div class="marca"><img class="logo" src="img/nexus-icone.png" alt=""><div class="nome">NEXUS</div></div>
      <p class="muted">Painel de atendimento. Entre com o seu usuário e senha.</p>
      <label>Usuário
        <input id="usuario" autocomplete="username" maxlength="60" required>
      </label>
      <label>Senha
        <input id="senha" type="password" autocomplete="current-password" maxlength="200" required>
      </label>
      <label class="toggle"><input type="checkbox" id="manter" checked> Manter conectado neste computador</label>
      <p id="login-erro" class="erro" hidden></p>
      <button type="submit" class="btn primario">Entrar</button>
    </form>

    <!-- Primeiro acesso: o banco ainda não tem usuários. A chave de API do servidor prova que é o dono. -->
    <form id="form-primeiro" class="card login-card" hidden>
      <img class="logo-nexus" src="img/nexus-logo.webp" alt="Nexus — Conexão e Inovação" width="660" height="240">
      <h2>Primeiro acesso</h2>
      <p class="muted">Crie o administrador do painel. Depois ele cadastra os atendentes em <b>Administração</b>.</p>
      <label>Chave de API do servidor (<code>API_KEY</code> do <code>.env</code>)
        <input name="chave_api" type="password" autocomplete="off" required>
      </label>
      <label>Seu nome <input name="nome" maxlength="120" required></label>
      <label>Usuário <input name="usuario" autocomplete="username" maxlength="60" required></label>
      <label>Senha (mínimo 8 caracteres) <input name="senha" type="password" autocomplete="new-password" minlength="8" maxlength="200" required></label>
      <label>Repita a senha <input name="senha2" type="password" autocomplete="new-password" minlength="8" maxlength="200" required></label>
      <p id="primeiro-erro" class="erro" hidden></p>
      <button type="submit" class="btn primario">Criar administrador e entrar</button>
    </form>
  </main>

  <div id="app" class="app" hidden>
    <!-- Menu lateral (layout da dashboard do chat de atendimento, ADR-016) -->
    <aside class="lateral">
      <div class="marca"><img class="logo" src="img/nexus-icone.png" alt="Nexus"><div class="nome">NEXUS</div></div>
      <div class="menu-titulo">Menu</div>
      <nav class="menu" aria-label="Páginas">
        <button type="button" data-pagina="atendimento" aria-current="page"><span aria-hidden="true">💬</span> Atendimento <span id="badge-espera" class="badge" hidden></span></button>
        <button type="button" data-pagina="incidentes"><span aria-hidden="true">🚨</span> Incidentes <span id="badge-incidentes" class="badge" hidden></span></button>
        <button type="button" data-pagina="relatorios"><span aria-hidden="true">📋</span> Relatórios</button>
        <button type="button" data-pagina="recorrencia"><span aria-hidden="true">📈</span> Recorrência</button>
      </nav>
      <hr>
      <div class="quem-logado"><div class="avatar" id="eu-inicial">?</div>
        <div><div class="nome" id="eu-nome"></div><div class="legenda" id="eu-papel"></div></div></div>
      <!-- De plantão: recebe o alerta (piscando, notificação e som) quando chega um problema crítico (ADR-020) -->
      <label class="toggle plantao" title="Quem está de plantão é avisado na hora dos problemas críticos">
        <input type="checkbox" id="plantao"> De plantão</label>
      <p id="status" class="legenda" aria-live="polite"></p>
      <button id="sair" class="btn sair" type="button">Sair</button>
    </aside>

    <main class="conteudo">
      <!-- Alerta de problema crítico: pisca para todos e avisa quem está de plantão -->
      <div id="alerta-critico" class="alerta-critico" role="alert" hidden></div>
      <h1 id="titulo">Atendimento</h1>

      <!-- Atendimento: fila estilo chat (em espera × respondidos) e conversa com a triagem -->
      <section id="pagina-atendimento" class="pagina">
        <div class="barra-fila">
          <input id="busca" class="busca" type="search" placeholder="Pesquisar cliente ou mensagem…" aria-label="Buscar atendimento">
          <select id="filtro-equipe" aria-label="Fila da equipe" title="A IA encaminha cada atendimento para uma equipe; a fila já vem na ordem de prioridade">
            <option value="">Todas as equipes</option>
            <option value="financeiro">Financeiro</option>
            <option value="suporte_tecnico">Suporte técnico</option>
            <option value="engenharia">Engenharia</option>
            <option value="retencao">Retenção</option>
            <option value="atendimento">Atendimento</option>
          </select>
        </div>
        <div class="atendimento">
          <div class="coluna-lista">
            <div class="abas-lista" role="tablist">
              <button type="button" role="tab" data-lista="espera" aria-selected="true">Em espera (<span id="qtd-espera">0</span>)</button>
              <button type="button" role="tab" data-lista="ia" aria-selected="false" title="Urgência baixa e média: a IA responde sozinha">🤖 IA atendendo (<span id="qtd-ia">0</span>)</button>
              <button type="button" role="tab" data-lista="atendimento" aria-selected="false">Em atendimento (<span id="qtd-atendimento">0</span>)</button>
              <button type="button" role="tab" data-lista="finalizados" aria-selected="false">Finalizados (<span id="qtd-finalizados">0</span>)</button>
            </div>
            <div id="cartoes" class="cartoes"></div>
          </div>
          <div id="detalhe" class="detalhe">
            <div class="vazio">Escolha um atendimento na lista.</div>
          </div>
        </div>
      </section>

      <section id="pagina-incidentes" class="pagina" hidden>
        <label class="toggle"><input type="checkbox" id="todos-grupos"> Mostrar também grupos que ainda não são incidente</label>
        <div id="lista-incidentes"></div>
      </section>

      <!-- Recorrência: painel no estilo Grafana com motivos de contato, incidentes e precisão da triagem -->
      <section id="pagina-recorrencia" class="pagina" hidden>
        <div class="gf-toolbar">
          <div class="gf-periodo" role="group" aria-label="Período">
            <button type="button" data-periodo="24" aria-pressed="true">Últimas 24 h</button>
            <button type="button" data-periodo="168" aria-pressed="false">7 dias</button>
            <button type="button" data-periodo="720" aria-pressed="false">30 dias</button>
            <button type="button" data-periodo="0" aria-pressed="false">Tudo</button>
          </div>
          <span id="gf-atualizado" class="gf-atualizado"></span>
        </div>
        <div id="gf-grade" class="gf-grade"></div>
      </section>

      <!-- Relatórios: problemas, quantas vezes aconteceram e quais clientes foram afetados (ADR-020) -->
      <section id="pagina-relatorios" class="pagina" hidden>
        <form id="form-problema" class="card form-problema">
          <h2>Novo problema</h2>
          <label>Título <input name="titulo" maxlength="160" required placeholder="Ex.: Pix não cai no Banco X"></label>
          <label>Características <textarea name="caracteristicas" rows="3" maxlength="4000" required
            placeholder="O que acontece, desde quando, em que situação, mensagens de erro…"></textarea></label>
          <button type="submit" class="btn primario">Criar problema</button>
          <span id="problema-status" class="muted" aria-live="polite"></span>
        </form>
        <div id="lista-problemas"></div>
      </section>

    <!-- Registrar o atendimento aberto como ocorrência de um problema -->
    <dialog id="dlg-ocorrencia" class="modal">
      <form id="form-ocorrencia" method="dialog">
        <h2>Registrar problema</h2>
        <label>Problema <select name="problema_id"></select></label>
        <div class="novo-problema" hidden>
          <label>Título <input name="titulo" maxlength="160" placeholder="Ex.: Pix não cai no Banco X"></label>
          <label>Características <textarea name="caracteristicas" rows="3" maxlength="4000"></textarea></label>
        </div>
        <label>Identificação do cliente <input name="cliente_id" maxlength="190" required></label>
        <label>Observação (opcional) <input name="observacao" maxlength="500"></label>
        <input type="hidden" name="ticket_id">
        <p id="ocorrencia-status" class="muted" aria-live="polite"></p>
        <div class="acoes-modal"><button type="button" class="btn" data-fechar>Cancelar</button>
          <button type="submit" class="btn primario" value="registrar">Registrar</button></div>
      </form>
    </dialog>
    </main>
  </div>
</body>
</html>
